events {}

http {
  server {
    listen 80;

    location /api/v1/schemes {
      proxy_pass http://catalog:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/matches {
      proxy_pass http://eligibility:8002;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/feedback {
      proxy_pass http://feedback:8004;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
      proxy_pass http://catalog:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      return 200 '{"status": "SchemeGuide API running"}';
      add_header Content-Type application/json;
    }
  }
}

name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── Detect which paths changed ────────────────────────────────────────────
  # Every subsequent job reads these outputs to decide whether to run.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      eligibility: ${{ steps.filter.outputs.eligibility }}
      catalog: ${{ steps.filter.outputs.catalog }}
      feedback: ${{ steps.filter.outputs.feedback }}
      python: ${{ steps.filter.outputs.python }}
      fixture: ${{ steps.filter.outputs.fixture }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            eligibility:
              - 'services/eligibility/**'
            catalog:
              - 'services/catalog/**'
            feedback:
              - 'services/feedback/**'
            python:
              - 'services/**/*.py'
            fixture:
              - 'services/catalog/fixtures/**'
            frontend:
              - 'frontend/**'

  # ── Eligibility engine unit tests ─────────────────────────────────────────
  test-eligibility:
    name: Eligibility engine tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.eligibility == 'true'
    defaults:
      run:
        working-directory: services/eligibility

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/eligibility/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v

  # ── Catalog API tests (Django, SQLite) ────────────────────────────────────
  test-catalog:
    name: Catalog API tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.catalog == 'true'
    defaults:
      run:
        working-directory: services/catalog

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/catalog/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run Django tests
        run: python manage.py test schemes.tests -v 2
        env:
          CATALOG_SECRET_KEY: ci-test-secret-key-not-real
          CATALOG_DEBUG: "true"
          # DATABASE_URL intentionally not set → Django falls back to SQLite

  # ── Feedback API tests (FastAPI, in-memory SQLite) ────────────────────────
  test-feedback:
    name: Feedback API tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.feedback == 'true'
    defaults:
      run:
        working-directory: services/feedback

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/feedback/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run pytest
        run: python -m pytest tests/ -v

  # ── Python lint (all services) ────────────────────────────────────────────
  lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check services/

  # ── Fixture JSON validation ───────────────────────────────────────────────
  # NO path filter — always runs on every PR.
  # This is the only check that matters for data-only PRs.
  validate-fixture:
    name: Validate fixture JSON
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate sample_schemes.json is valid JSON
        run: python3 -m json.tool services/catalog/fixtures/sample_schemes.json > /dev/null

      - name: Check all scheme versions have a valid status
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("services/catalog/fixtures/sample_schemes.json") as f:
              data = json.load(f)
          bad = [
              obj for obj in data
              if obj["model"] == "schemes.schemeversion"
              and obj["fields"].get("status") not in ("draft", "reviewed", "published")
          ]
          if bad:
              print(f"ERROR: {len(bad)} scheme version(s) have invalid status")
              sys.exit(1)
          print(f"OK: {len(data)} objects, all scheme versions have valid status")
          EOF

      - name: Check income values are plain rupee numbers, not lakhs
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("services/catalog/fixtures/sample_schemes.json") as f:
              data = json.load(f)
          bad = [
              obj["fields"].get("value", "")
              for obj in data
              if obj["model"] == "schemes.eligibilityrule"
              and "lakh" in obj["fields"].get("value", "").lower()
          ]
          if bad:
              print(f"ERROR: income values must be plain rupees, not lakhs: {bad}")
              sys.exit(1)
          print("OK: no lakh values found")
          EOF

  # ── Docker build smoke test ───────────────────────────────────────────────
  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: catalog
            context: services/catalog
          - service: eligibility
            context: services/eligibility
          - service: assistant
            context: services/assistant
          - service: feedback
            context: services/feedback
          - service: frontend
            context: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        run: docker build ${{ matrix.context }}

services:

  db:
    image: postgres:16
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5

  catalog:
    build:
      context: ../services/catalog
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${CATALOG_DATABASE_URL}
      SECRET_KEY: ${CATALOG_SECRET_KEY}
      DEBUG: ${CATALOG_DEBUG}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8001"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py loaddata fixtures/sample_schemes.json || true &&
             python manage.py collectstatic --noinput &&
             gunicorn catalog_service.wsgi:application --bind 0.0.0.0:8001"

  eligibility:
    build:
      context: ../services/eligibility
      dockerfile: Dockerfile
    env_file:
      - ../.env
    depends_on:
      - catalog
    expose:
      - "8002"
    command: uvicorn main:app --host 0.0.0.0 --port 8002

  feedback:
    build:
      context: ../services/feedback
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${FEEDBACK_DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8004"
    command: uvicorn main:app --host 0.0.0.0 --port 8004

  assistant:
    build:
      context: ../services/assistant
      dockerfile: Dockerfile
    env_file:
      - ../.env
    depends_on:
      - catalog
    expose:
      - "8003"
    dns:
      - 8.8.8.8
      - 8.8.4.4

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    expose:
      - "80"

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - catalog
      - eligibility
      - feedback
      - assistant
      - frontend

volumes:
  postgres_data:
